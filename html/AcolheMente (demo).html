<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AcolheMente (demo)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Nunito:wght@400;600;700&display=swap">
<style>
:root{--bg1:#e9f1ec;--bg2:#f8ebe4;--bg3:#ece8f5;--ink:#26332f;--muted:#5f716b;--brand:#3f7f6f;--brand2:#2d6254;--accent:#f0b98a;--card:rgba(255,255,255,.82);--line:#d9e4de;--danger:#b3412f;--tag:#e1efe9;--tagi:#2d6254;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#14201d;--bg2:#241d1c;--bg3:#1b1a26;--ink:#e8f0ed;--muted:#a3b7b0;--brand:#5fb09c;--brand2:#7cc7b3;--card:rgba(30,44,40,.85);--line:#33493f;--tag:#23403a;--tagi:#a6e0d1}}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;font-family:Nunito,"Segoe UI",system-ui,sans-serif;color:var(--ink);line-height:1.65;background:radial-gradient(circle at 12% 8%,var(--bg3),transparent 45%),radial-gradient(circle at 90% 20%,var(--bg2),transparent 50%),radial-gradient(circle at 50% 100%,var(--bg1),transparent 60%),var(--bg1);background-attachment:fixed}
h1,h2,h3,.logo{font-family:Fraunces,Georgia,serif}
header{padding:10px 0}.bar{max-width:920px;margin:auto;padding:10px 20px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
.logo{font-weight:700;font-size:1.5rem;color:var(--brand2)}
nav{display:flex;flex-wrap:wrap;gap:6px}@media(max-width:760px){.bar{justify-content:center}nav{justify-content:center}}nav a{color:var(--ink);text-decoration:none;margin:0;padding:8px 14px;border-radius:20px;white-space:nowrap;text-align:center}nav a.on{background:var(--brand);color:#fff}nav a:hover:not(.on){background:var(--tag)}
main{max-width:920px;margin:auto;padding:12px 20px 50px}h1{font-size:clamp(2rem,5vw,3rem);line-height:1.15;margin:.2em 0 .3em}
.lead{color:var(--muted);font-size:1.12rem;max-width:58ch}
.card{background:var(--card);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:18px;padding:20px}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:center;margin-top:10px}
@media(max-width:700px){.hero{grid-template-columns:1fr}}
.breath{display:flex;flex-direction:column;align-items:center;gap:14px}
.orb{width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff9,var(--accent) 45%,var(--brand) 100%);animation:resp 8s ease-in-out infinite;box-shadow:0 10px 40px #3f7f6f55}
@keyframes resp{0%,100%{transform:scale(.7)}50%{transform:scale(1.05)}}
@media(prefers-reduced-motion:reduce){.orb{animation:none}}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:26px}
.btn{display:inline-block;background:var(--brand);color:#fff;border:0;border-radius:24px;padding:12px 26px;font:700 1rem Nunito,sans-serif;text-decoration:none;cursor:pointer}.btn:hover{background:var(--brand2)}
.btn.sec{background:transparent;color:var(--brand2);border:2px solid var(--brand)}
.alert{background:#fff4e0;color:#4a3711;border-left:5px solid var(--accent);padding:12px 16px;border-radius:10px;margin:18px 0}
.prog{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:14px 0 6px}.prog i{display:block;height:100%;background:var(--brand);transition:width .4s}
.q{margin:0 0 14px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--card)}.q legend{font-weight:700;padding:0 6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}.opts label{cursor:pointer;padding:8px 14px;border:1px solid var(--line);border-radius:20px}
.opts label:has(input:checked){background:var(--brand);color:#fff;border-color:var(--brand)}.opts input{position:absolute;opacity:0}.opts label:has(input:focus-visible){outline:3px solid var(--accent)}
.erro{color:var(--danger);font-weight:700}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.f-baixo{border-left:6px solid #3d9a6b}.f-moderado{border-left:6px solid var(--accent)}.f-alto{border-left:6px solid var(--danger)}
.bar2{height:10px;border-radius:8px;background:var(--line);margin:4px 0 12px;overflow:hidden}.bar2 i{display:block;height:100%}
select,input{padding:11px;border:1px solid var(--line);border-radius:12px;font:1rem Nunito,sans-serif;background:var(--card);color:var(--ink)}
.tag{font-size:.85rem;background:var(--tag);color:var(--tagi);padding:2px 10px;border-radius:12px}.item{margin-top:12px}.item h3{margin:0 0 4px;font-size:1.1rem}
.chart{display:flex;align-items:flex-end;gap:8px;height:170px;padding:8px 0;overflow-x:auto}.col{flex:0 0 34px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.7rem;color:var(--muted)}.col i{display:block;width:22px;border-radius:8px 8px 4px 4px}
textarea{width:100%;min-height:190px;padding:12px;border:1px solid var(--line);border-radius:12px;font:1rem Nunito,sans-serif;background:var(--card);color:var(--ink)}
.chk{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}.chk label{padding:8px 14px;border:1px solid var(--line);border-radius:20px;cursor:pointer}.chk label:has(input:checked){background:var(--brand);color:#fff;border-color:var(--brand)}.chk input{position:absolute;opacity:0}.chk label:has(input:focus-visible){outline:3px solid var(--accent)}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-weight:700}.fld select,.fld input{font-weight:400}
.big{font:700 3.2rem Fraunces,serif;text-align:center;margin:6px 0;color:var(--brand2)}.orb2{width:150px;height:150px;border-radius:50%;margin:10px auto;background:radial-gradient(circle at 35% 30%,#fff9,var(--accent) 45%,var(--brand) 100%);transform:scale(.6)}
input[type=range]{width:100%;padding:0}footer{text-align:center;color:var(--muted);font-size:.9rem;padding:20px}a{color:var(--brand2)}
</style></head><body>
<header><div class="bar"><span class="logo">AcolheMente</span><nav><a href="#inicio" data-r="inicio">Início</a><a href="#triagem" data-r="triagem">Triagem</a><a href="#apoio" data-r="apoio">Rede de apoio</a><a href="#termometro" data-r="termometro">Meu termômetro</a><a href="#mensagem" data-r="mensagem">Pedir ajuda</a><a href="#provas" data-r="provas">Semana de provas</a></nav></div></header>
<main id="app"></main>
<footer>Demonstração informativa, não substitui atendimento profissional. Em crise: <strong>188</strong> (CVV) ou <strong>192</strong> (SAMU).</footer>
<script>
const O=["Nunca","Algumas vezes","Frequentemente","Quase sempre"];
const S=[
{k:"Ansiedade",d:"Como sua mente e seu corpo têm reagido às preocupações.",q:["Com que frequência você sentiu um nervosismo difícil de acalmar, mesmo sem um motivo claro?","Com que frequência as preocupações pareceram impossíveis de controlar ou desligar?","Com que frequência você evitou algo importante (prova, apresentação, aula) por medo de não dar conta?","Com que frequência seu corpo reagiu à tensão, com coração acelerado, aperto no peito ou falta de ar?"],
 dica:"Técnicas de respiração, pausas planejadas e conversar com um profissional sobre a ansiedade podem aliviar bastante."},
{k:"Humor",d:"Seu ânimo e a forma como você se enxerga.",q:["Com que frequência você se sentiu triste, vazio(a) ou sem esperança?","Com que frequência perdeu o interesse ou o prazer em coisas que antes gostava?","Com que frequência se cobrou de forma dura, achando que é um fracasso ou que decepciona os outros?","Com que frequência teve dificuldade de se concentrar ou de tomar decisões simples?"],
 dica:"Esses sinais merecem atenção. Falar com um psicólogo ou com a UBS da sua cidade é um bom próximo passo."},
{k:"Exaustão acadêmica",d:"O peso da rotina de estudos, trabalho e cobranças.",q:["Com que frequência você acordou já cansado(a) só de pensar na rotina da faculdade?","Com que frequência sentiu que, por mais que se esforce, nunca é o suficiente?","Com que frequência se sentiu desmotivado(a) ou com vontade de desistir do curso?","Com que frequência a rotina (estudo, trabalho, deslocamento) tirou seu tempo de descanso e lazer?"],
 dica:"Procure a coordenação ou o núcleo de apoio da sua instituição e tente reservar blocos de descanso na agenda."},
{k:"Sono e corpo",d:"O quanto o corpo está pedindo pausa.",q:["Com que frequência você teve dificuldade para dormir, acordou durante a noite ou dormiu demais?","Com que frequência mudou muito seu apetite ou sentiu dores e mal-estar sem causa física aparente?"],
 dica:"Rotina de sono regular, menos telas à noite e movimento leve ajudam. Se persistir, converse com um profissional de saúde."},
{k:"Conexões",d:"Sua rede de pessoas e o quanto você se sente amparado(a).",q:["Com que frequência você se sentiu sozinho(a), mesmo estando perto de outras pessoas?","Com que frequência se afastou de amigos, colegas ou da família?","Com que frequência sentiu que não tinha com quem falar sobre o que está sentindo?"],
 dica:"Contar para uma pessoa de confiança já reduz o peso. Grupos de acolhimento e serviços gratuitos também ajudam."},
{k:"Segurança",d:"Uma pergunta delicada, mas importante. Sua resposta é só sua.",q:["Com que frequência você teve pensamentos de que seria melhor não estar aqui ou de se machucar?"],
 dica:""}];
const FLAT=[];S.forEach((s,si)=>s.q.forEach(t=>FLAT.push([si,t])));
const C="Adamantina,Americana,Araçatuba,Araraquara,Araras,Atibaia,Barretos,Barueri,Bauru,Bebedouro,Birigui,Botucatu,Bragança Paulista,Caieiras,Cajamar,Campinas,Campo Limpo Paulista,Caraguatatuba,Carapicuíba,Catanduva,Cotia,Cubatão,Diadema,Embu das Artes,Ferraz de Vasconcelos,Franca,Francisco Morato,Franco da Rocha,Guarujá,Guaratinguetá,Guarulhos,Hortolândia,Ibiúna,Indaiatuba,Itanhaém,Itapecerica da Serra,Itapetininga,Itapevi,Itaquaquecetuba,Itatiba,Itu,Jaboticabal,Jacareí,Jandira,Jaú,Jundiaí,Limeira,Lins,Marília,Mauá,Mogi das Cruzes,Mogi Guaçu,Mogi Mirim,Mongaguá,Osasco,Ourinhos,Paulínia,Peruíbe,Piracicaba,Poá,Praia Grande,Presidente Prudente,Ribeirão Pires,Ribeirão Preto,Rio Claro,Rio Grande da Serra,Salto,Santa Bárbara d'Oeste,Santana de Parnaíba,Santo André,Santos,São Bernardo do Campo,São Caetano do Sul,São Carlos,São João da Boa Vista,São José do Rio Preto,São José dos Campos,São Paulo,São Roque,São Sebastião,São Vicente,Sertãozinho,Sorocaba,Sumaré,Suzano,Taboão da Serra,Taubaté,Tatuí,Ubatuba,Valinhos,Vargem Grande Paulista,Votorantim,Várzea Paulista".split(",");
const I=[
{n:"CVV - Centro de Valorização da Vida",t:"Linha de apoio",e:"Online e telefone, 24h",c:"*",tel:"188",m:"Telefone / chat",g:1},
{n:"SAMU (urgência em saúde)",t:"Urgência",e:"Emergências, inclusive crise emocional",c:"*",tel:"192",m:"Telefone",g:1},
{n:"Disque Saúde (Ministério da Saúde)",t:"Linha de apoio",e:"Orientação sobre serviços do SUS",c:"*",tel:"136",m:"Telefone",g:1},
{n:"Centro Escola do Instituto de Psicologia da USP (CEIP)",t:"Clínica-escola",e:"Cidade Universitária, Butantã. Gratuito para a comunidade USP e moradores do entorno",c:"São Paulo",tel:"+551130915015",fone:"(11) 3091-5015",email:"ceip@usp.br",site:"https://www.ip.usp.br/site/?p=14730",m:"Presencial",g:1},
{n:"Clínica Psicológica Ana Maria Poppovic (PUC-SP)",t:"Clínica-escola",e:"Rua Almirante Pereira Guimarães, 150 – Pacaembu. Confirme valores e vagas",c:"São Paulo",tel:"+551138626070",fone:"(11) 3862-6070",site:"https://www.pucsp.br/clinica/atendimento.html",m:"Presencial",g:0},
{n:"Unidade Saúde Escola (UFSCar)",t:"Clínica-escola",e:"Rodovia Washington Luís, km 235 – campus da UFSCar. Confirme se o contato segue atual",c:"São Carlos",tel:"+551633518411",fone:"(16) 3351-8411",email:"use@ufscar.br",m:"Presencial",g:1}];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app=document.getElementById("app");
function inicio(){app.innerHTML=`<div class="hero"><div><h1>Respire. Você chegou a um lugar seguro.</h1><p class="lead">Faça uma autoavaliação cuidadosa e encontre atendimento psicológico gratuito ou de baixo custo em todo o estado de São Paulo.</p><p><a class="btn" href="#triagem">Começar triagem</a> <a class="btn sec" href="#apoio">Ver rede de apoio</a></p></div><div class="breath"><div class="orb" role="img" aria-label="Círculo que expande e contrai para guiar a respiração"></div><small class="lead">Inspire ao crescer, solte o ar ao diminuir.</small></div></div><div class="alert"><strong>Em crise agora?</strong> Ligue 188 (CVV, 24h) ou 192 (SAMU).</div><div class="grid"><section class="card"><h3>Triagem de bem-estar</h3><p>18 perguntas em 6 áreas da sua vida. Informativa, sem diagnóstico.</p></section><section class="card"><h3>Rede de apoio</h3><p>Escolha sua cidade e veja a UBS e as clínicas-escola perto de você.</p></section><section class="card"><h3>Sem julgamento</h3><p>Nada do que você responde nesta demo é salvo ou identificado.</p></section></div>`}
let sec=0,resp={};
function triagem(){sec=0;resp={};passo()}
function passo(){const s=S[sec],base=S.slice(0,sec).reduce((a,x)=>a+x.q.length,0);
app.innerHTML=`<h1>${esc(s.k)}</h1><p class="lead">${esc(s.d)}</p><div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${S.length}" aria-valuenow="${sec+1}"><i style="width:${(sec+1)/S.length*100}%"></i></div><small>Etapa ${sec+1} de ${S.length}. Pense nas últimas duas semanas.</small><form id="f" novalidate style="margin-top:14px">${s.q.map((t,i)=>{const id=base+i;return `<fieldset class="q"><legend>${esc(t)}</legend><div class="opts">${O.map((o,v)=>`<label><input type="radio" name="p${id}" value="${v}" ${resp[id]===v?"checked":""}>${o}</label>`).join("")}</div></fieldset>`}).join("")}<p id="er" class="erro" role="alert"></p><div class="row">${sec?'<button type="button" class="btn sec" id="vo">Voltar</button>':""}<button class="btn" type="submit">${sec<S.length-1?"Continuar":"Ver orientações"}</button></div></form>`;
if(sec)document.getElementById("vo").onclick=()=>{sec--;passo()};
document.getElementById("f").onsubmit=e=>{e.preventDefault();for(let i=0;i<s.q.length;i++){const m=document.querySelector(`input[name=p${base+i}]:checked`);if(!m){document.getElementById("er").textContent="Responda todas as perguntas desta etapa para continuar.";return}resp[base+i]=+m.value}
if(sec<S.length-1){sec++;passo();scrollTo(0,0)}else resultado()}}
function resultado(){let tot=0,max=0,html="",id=0,risco=false;
S.forEach((s,si)=>{let p=0;s.q.forEach(()=>{p+=resp[id];if(si==S.length-1&&resp[id]>0)risco=true;id++});const m=s.q.length*3;
if(si<S.length-1){tot+=p;max+=m;const r=p/m,cor=r<=.33?"#3d9a6b":r<=.66?"#e0a43c":"#b3412f",n=r<=.33?"baixo":r<=.66?"moderado":"alto";
html+=`<h3 style="margin:14px 0 0">${esc(s.k)}: nível ${n}</h3><div class="bar2"><i style="width:${Math.max(r*100,4)}%;background:${cor}"></i></div>${r>.33?`<p style="margin:0 0 8px">${esc(s.dica)}</p>`:""}`}});
const r=tot/max,f=r<=.33?"baixo":r<=.66?"moderado":"alto";ultimo={d:Date.now(),p:Math.round(r*100),t:"t"};
const t={baixo:"Seus relatos indicam um momento mais leve. Continue cuidando da rotina, do sono e das suas relações.",moderado:"Há sinais de sobrecarga. Conversar com alguém de confiança e procurar um serviço de acolhimento pode ajudar.",alto:"Há sinais importantes de sofrimento. Recomendamos buscar apoio profissional em breve, você merece esse cuidado."}[f];
app.innerHTML=`<h1>Seu resultado</h1>${risco?`<div class="alert"><strong>Você marcou pensamentos difíceis, e isso importa.</strong> Fale agora com alguém: ligue 188 (CVV, 24h, gratuito) ou 192 (SAMU). Você não precisa enfrentar isso sozinho(a).</div>`:""}<section class="card f-${f}"><h2>Panorama geral: ${tot} de ${max}</h2><p>${esc(t)}</p>${html}<p class="lead" style="font-size:.95rem">Esta triagem é informativa e não substitui avaliação profissional.</p><div class="row"><a class="btn" href="#apoio">Encontrar apoio</a><a class="btn sec" href="#triagem">Refazer</a></div><div class="row"><button class="btn sec" id="sv">Salvar no meu termômetro (só neste aparelho)</button></div></section>`;const b=document.getElementById("sv");b.onclick=()=>{salvar(ultimo);b.textContent="Salvo neste aparelho ✓";b.disabled=true};scrollTo(0,0)}
function apoio(){const CL=I.filter(i=>i.c!="*");let tipo="";
app.innerHTML=`<h1>Rede de apoio</h1><p class="lead">Encontre atendimento psicológico gratuito ou de baixo custo no estado de São Paulo.</p>
<section class="card" style="border-left:6px solid var(--danger)"><h3 style="margin-top:0">Precisa de ajuda agora?</h3><p style="margin-top:0">Ligações gratuitas, a qualquer hora.</p><div class="row" style="margin-top:0"><a class="btn" href="tel:188">Ligar 188 · CVV</a><a class="btn" href="tel:192">Ligar 192 · SAMU</a><a class="btn sec" href="tel:136">Ligar 136 · Disque Saúde</a></div></section>
<h2 style="margin:28px 0 8px">Perto de você</h2><label class="fld" style="max-width:340px">Sua cidade<select id="fc"><option value="">Selecione uma cidade</option>${C.map(c=>`<option>${esc(c)}</option>`).join("")}<option value="__o">Outra cidade de SP</option></select></label>
<div class="chk" id="ch" style="margin-bottom:6px"><button class="btn sec" data-t="" type="button">Todos</button><button class="btn sec" data-t="s" type="button">UBS (SUS)</button><button class="btn sec" data-t="c" type="button">Clínicas-escola</button></div><div id="l"></div>`;
const r=()=>{const c=fc.value,nome=c&&c!="__o"?c:"";
ch.querySelectorAll("button").forEach(b=>{const on=b.dataset.t==tipo;b.style.background=on?"var(--brand)":"transparent";b.style.color=on?"#fff":"var(--brand2)";b.setAttribute("aria-pressed",on)});
if(!c){l.innerHTML=`<div class="card"><p style="margin:0">Escolha sua cidade para ver os serviços perto de você. Também listamos abaixo as clínicas-escola do estado.</p></div>`+(tipo!="s"?CL.map(card).join(""):"");return}
const q=nome?encodeURIComponent(nome+" SP"):"perto de mim",gm=t=>`https://www.google.com/maps/search/${t}+${q}`;
const pub=`<article class="card item"><h3>UBS${nome?" de "+esc(nome):""}</h3><span class="tag">Serviço público</span> <span class="tag">Gratuito</span><p>O SUS oferece atendimento de saúde mental em todo município. A UBS é a porta de entrada do SUS, gratuita, e pode encaminhar para psicólogo ou, se for preciso, para serviços especializados. Em sofrimento muito intenso, procure a UBS, ligue 192 (SAMU) ou 188 (CVV).</p><div class="row" style="margin-top:0"><a class="btn" href="${gm("UBS")}" target="_blank" rel="noopener">Ver UBS no mapa</a><a class="btn sec" href="tel:156">Ligar 156 (prefeitura)</a></div></article>`;
const loc=nome?CL.filter(i=>i.c==nome):[];
const cli=loc.length?loc.map(card).join(""):`<article class="card item"><h3>Clínicas-escola${nome?" em "+esc(nome):""}</h3><p style="margin:0">Nenhuma cadastrada nesta demo${nome?" para "+esc(nome):""}. Pergunte nas faculdades de Psicologia da região, muitas atendem a comunidade a preço social.</p></article>`;
l.innerHTML=(tipo!="c"?pub:"")+(tipo!="s"?cli:"")};
const card=i=>`<article class="card item"><h3>${esc(i.n)}</h3><span class="tag">${esc(i.t)}</span> <span class="tag">${i.g?"Gratuito":"Baixo custo"}</span> <span class="tag">${esc(i.c)}</span><p style="margin-bottom:0">${esc(i.e)}<br>Modalidade: ${esc(i.m)}</p>${btns(i,"")}</article>`;
fc.onchange=r;ch.onclick=e=>{const b=e.target.closest("button");if(b){tipo=b.dataset.t;r()}};r()}

let ultimo=null,tm=null;const K="acolhe_hist";
const ler=()=>{try{return JSON.parse(localStorage.getItem(K))||[]}catch{return[]}};
const salvar=e=>{try{const h=ler();h.push(e);localStorage.setItem(K,JSON.stringify(h.slice(-26)))}catch{}};
const dm=t=>{const d=new Date(t);return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")};
function termometro(){const h=ler();
const graf=h.length?`<div class="chart" role="img" aria-label="Gráfico de bem-estar ao longo do tempo">${h.map(e=>{const b=100-e.p,c=b>=67?"#3d9a6b":b>=34?"#e0a43c":"#b3412f";return `<div class="col"><i style="height:${Math.max(b,4)*1.2}px;background:${c}" title="Bem-estar ${b}%"></i>${dm(e.d)}${e.t=="t"?" T":""}</div>`}).join("")}</div><small>Quanto mais alta a barra, maior o bem-estar. T = triagem completa.</small>`:"<p>Ainda não há registros. Faça o primeiro check-in abaixo.</p>";
let msg="";if(h.length>=3){const u=h.slice(-3).map(e=>100-e.p);if(u.every(x=>x<40))msg="Suas últimas semanas vêm pesadas. Que tal pedir ajuda agora? Use a página Pedir ajuda para montar a mensagem.";else if(u[2]>u[0]+10)msg="Seu bem-estar vem melhorando. Continue com o que está funcionando.";else msg="Seu bem-estar está estável nas últimas semanas."}

function mensagem(){app.innerHTML=`<h1>Pedir ajuda</h1><p class="lead">Difícil saber o que dizer? Monte uma mensagem pronta para enviar à clínica-escola ou à UBS.</p><section class="card" style="margin-bottom:16px"><h3>Como funciona</h3><p>Muita gente adia o pedido de ajuda por não saber o que dizer. Aqui você monta a mensagem em três passos simples:</p><div class="grid" style="margin-top:10px"><div><strong>1. Escolha e conte</strong><br>Selecione o serviço, marque o que tem sentido e informe como e quando prefere ser atendido.</div><div><strong>2. Revise o texto</strong><br>O site escreve uma mensagem educada e objetiva, que você pode editar do seu jeito antes de enviar.</div><div><strong>3. Copie e envie</strong><br>Copie o texto ou abra o WhatsApp com ele pronto, e mande ao serviço que você escolheu.</div></div><p style="margin-bottom:0"><small>Privacidade: a mensagem é montada no seu navegador e nada é enviado ou salvo por nós. Você só precisa informar o que se sentir à vontade, e o nome é opcional. Na resposta, vale perguntar sobre fila de espera, documentos e custo.</small></p></section><section class="card"><label class="fld">Para quem é a mensagem<select id="de"><option value="c">Clínica-escola de Psicologia</option><option value="u">UBS (pedir encaminhamento)</option></select></label><label class="fld">Sua cidade<select id="ci">${C.map(c=>`<option${c=="São Paulo"?" selected":""}>${esc(c)}</option>`).join("")}</select></label><label class="fld">Seu nome (opcional)<input id="nm" type="text" maxlength="60" autocomplete="off"></label><div class="fld">O que você tem sentido</div><div class="chk" id="mt">${["ansiedade","tristeza","exaustão com os estudos","dificuldade para dormir","solidão","dificuldade de concentração"].map(m=>`<label><input type="checkbox" value="${m}">${m}</label>`).join("")}</div><label class="fld">Como prefere o atendimento<select id="md"><option>presencial</option><option>online</option><option>tanto faz</option></select></label><label class="fld">Melhores horários<input id="hr" type="text" maxlength="60" placeholder="Ex.: manhãs ou depois das 18h"></label><button class="btn" id="gr">Gerar mensagem</button></section><section id="sa" class="card" style="margin-top:16px" hidden><h3>Sua mensagem (pode editar)</h3><textarea id="tx"></textarea><div class="row"><button class="btn" id="cp">Copiar</button><a class="btn sec" id="wa" target="_blank" rel="noopener">Compartilhar por WhatsApp</a></div></section><section id="env" class="card" style="margin-top:16px" hidden></section>`;
